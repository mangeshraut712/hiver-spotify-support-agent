[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-agent"
version = "0.1.0"
description = "SpotifyCares AI support agent for Hiver SDE Intern take-home"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "kagglehub>=0.3.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "tqdm>=4.66.0",
  "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
